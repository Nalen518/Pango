[project]
name = "agent"
version = "0.1.0"
description = "Pango agent service: research, targets, rebalancing, executor"
readme = "README.md"
authors = [
    { name = "Nalen518", email = "nalen.r.sadewa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
